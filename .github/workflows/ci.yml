name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck install.sh scripts/*.sh
      - run: scripts/build-release.sh v0.0.0
      - name: Install Caddy for integration test
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          GOBIN="$RUNNER_TEMP/caddy" go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - run: scripts/integration.sh
      - run: scripts/test-install.sh
